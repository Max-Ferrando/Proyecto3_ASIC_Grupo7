# pin_order.cfg - ubicacion de los terminales del macro (IO_PIN_ORDER_CFG).
# Se agrupan por funcion, para que en un chip completo cada grupo quede
# frente a sus pads y las rutas del pad al macro sean cortas y no se crucen.
#
#  Oeste : reloj y reset. Van juntos y al centro del lado, porque desde el
#          pin de reloj nace el arbol de reloj (CTS) que alimenta todos los FFs.
#  Norte : botones (entradas del jugador; pasan por el sincronizador 2-FF).
#  Sur   : LEDs y los dos displays de 7 segmentos (salidas visibles).
#  Este  : interfaz SPI (los 4 pines juntos, como un bus).

#W
$4
clk_i
rst_ni

#N
@min_distance=8
btn_i.*

#S
@min_distance=4
led_o.*
seg1_o.*
seg2_o.*

#E
@min_distance=8
spi_sclk_i
spi_mosi_i
spi_cs_n_i
spi_miso_o
